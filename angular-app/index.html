<!doctype html>
<html lang="es" ng-app="animeApp">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anime JSON - Angular</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script defer src="js/app.js"></script>
  </head>
  <body ng-controller="AnimeController as vm">
    <main class="container">
      <header>
        <h1>Catálogo de Anime</h1>
        <p>Carga animes desde archivos JSON y filtra por nombre.</p>
      </header>

      <section class="controls">
        <label for="source">Archivo JSON:</label>
        <select id="source" ng-model="vm.selectedSource" ng-options="source.path as source.label for source in vm.sources" ng-change="vm.loadAnime()"></select>

        <input type="text" placeholder="Buscar anime..." ng-model="vm.searchText" />
      </section>

      <p class="status" ng-if="vm.loading">Cargando archivo JSON...</p>
      <p class="status error" ng-if="vm.error">{{ vm.error }}</p>

      <section class="grid">
        <article class="card" ng-repeat="anime in vm.animeList | filter:{title: vm.searchText}">
          <img ng-src="{{ anime.cover }}" alt="{{ anime.title }}" loading="lazy" />
          <div class="content">
            <h2>{{ anime.title }}</h2>
            <p class="meta">{{ anime.genre }} · {{ anime.year }} · {{ anime.episodes }} episodios</p>
            <p>{{ anime.synopsis }}</p>
            <span class="rating">⭐ {{ anime.rating }}</span>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
