<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Test HLS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    video {
      width: 90%;
      max-width: 900px;
      margin-top: 20px;
      background: black;
    }
  </style>
</head>
<body>

<h2>Test reproducción HLS</h2>

<video id="video" controls autoplay></video>

<script>
  const video = document.getElementById("video");

  // 🔴 PEGA AQUÍ TU M3U8
  const src = "https://cdn-ucluajup8gvirr24.edgeon-bandwidth.com/engine/hls2-c/01/15612/ogdj6m3ufdz1_,n,.urlset/master.m3u8?t=xOWvQ2Se8bxMMD4oBe_l3rbUZ7QBGms2uBmee78aKN0&s=1767570892&e=14400&f=78063905&node=4LGAMh8o8XDdh9GyDh/zPBfQeD/JdRIqe16LTbNYigs=&i=190.212&sp=2500&asn=14754&q=n&rq=9s890vlP33Xz0NRqVgzpKNxUVJoXDzvQB8IuNOfa";
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari / iOS
    video.src = src;
  } else if (Hls.isSupported()) {
    // Chrome / Edge / Firefox
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    alert("Tu navegador no soporta HLS");
  }
</script>

</body>
</html>
