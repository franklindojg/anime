<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Test HLS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    video {
      width: 90%;
      max-width: 900px;
      margin-top: 20px;
      background: black;
    }
  </style>
</head>
<body>

<h2>Test reproducción HLS</h2>

<video id="video" controls autoplay></video>

<script>
  const video = document.getElementById("video");

  // 🔴 PEGA AQUÍ TU M3U8
  const src = "https://be2719.rcr22.ams01.i8yz83pn.com/hls2/07/10598/9gxklnkxxzgs_h/master.m3u8?t=58Jq4hLQFfeRn2pPicR2k45bI7iXA54tRpdTsajYwfw&s=1767623076&e=10800&f=52990709&srv=1070&asn=14754&sp=4000&p=0";
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari / iOS
    video.src = src;
  } else if (Hls.isSupported()) {
    // Chrome / Edge / Firefox
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    alert("Tu navegador no soporta HLS");
  }
</script>

</body>
</html>
