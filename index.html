<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Test HLS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- HLS.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    video {
      width: 90%;
      max-width: 900px;
      margin-top: 20px;
      background: black;
    }
  </style>
</head>
<body>

<h2>Test reproducción HLS</h2>

<video id="video" controls autoplay></video>

<script>
  const video = document.getElementById("video");

  // 🔴 PEGA AQUÍ TU M3U8
  const src = "https://cdn-z2a1mubxmjkn3ttc.edgeon-bandwidth.com/engine/hls2/01/15510/w5x7iljhcgjz_,n,.urlset/master.m3u8?t=VsMdL1x9hcOMeC_nMZguRC8m2fOa9LdPrzW086loYlw&s=1767551713&e=14400&f=77550841&node=ZRZ0K3iT4dJ85562a73rCEzGUukeH4sE88b4z/MvRGc=&i=190.212&sp=2500&asn=14754&q=n&rq=Xz9QB54YcitfkTtbBaOTHHSr9oVS3AMddTXZ8fPD";
  if (video.canPlayType("application/vnd.apple.mpegurl")) {
    // Safari / iOS
    video.src = src;
  } else if (Hls.isSupported()) {
    // Chrome / Edge / Firefox
    const hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false
    });
    hls.loadSource(src);
    hls.attachMedia(video);
  } else {
    alert("Tu navegador no soporta HLS");
  }
</script>

</body>
</html>
